name: CI — Security Audit & SBOM

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  # No secrets needed for lint/build/audit steps
  # Production secrets are injected by Freebuff/Vercel, not CI

jobs:
  security-audit:
    name: Security Audit & Supply Chain
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Verify lockfile integrity
        run: |
          echo "🔐 Verifying package-lock.json integrity..."
          npm ls --all --depth=0 2>&1 | head -5 || true
          echo "✔ Lockfile loaded — $(wc -l < package-lock.json) lines"

      - name: Clean install dependencies
        run: |
          echo "📦 Installing dependencies (frozen lockfile)..."
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Run npm audit (fail on high+)
        run: |
          echo "🔍 Running npm audit — failing on HIGH and CRITICAL vulnerabilities..."
          npm audit --audit-level=high
        continue-on-error: true
        id: npm_audit

      - name: Generate SBOM (CycloneDX)
        run: |
          echo "📋 Generating Software Bill of Materials (SBOM)..."
          mkdir -p sbom
          # npm 10+ supports native sbom generation
          npm sbom --sbom-format=cyclonedx > sbom/cyclonedx.json 2>&1 || \
          npm sbom > sbom/cyclonedx.json 2>&1

      - name: Generate SBOM summary
        run: |
          echo "📊 SBOM Summary:"
          if [ -f sbom/cyclonedx.json ]; then
            echo "  ✅ CycloneDX SBOM generated ($(wc -c < sbom/cyclonedx.json) bytes)"
            # Extract key metrics if jq is available
            if command -v jq &> /dev/null; then
              echo "  📦 Components: $(jq '.components | length // 0' sbom/cyclonedx.json)"
              echo "  🏷  Format: $(jq -r '.bomFormat // "unknown"' sbom/cyclonedx.json)"
            fi
          else
            echo "  ⚠️ Native npm sbom not available — installing CycloneDX tool..."
            npm install -g @cyclonedx/bom 2>&1 | tail -3
            cyclonedx-bom -o sbom/cyclonedx.json 2>&1 || echo "  ⚠️ SBOM generation skipped"
          fi

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom/cyclonedx.json
          retention-days: 90
          if-no-files-found: warn

      - name: Export audit summary
        run: |
          if [ -f sbom/cyclonedx.json ]; then
            TOTAL_DEPS=$(jq '.components | length // 0' sbom/cyclonedx.json)
            echo "## 📋 SBOM Generated" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Total dependencies catalogued:** $TOTAL_DEPS" >> $GITHUB_STEP_SUMMARY
            echo "- **Format:** CycloneDX 1.6" >> $GITHUB_STEP_SUMMARY
            echo "- **Artifact:** sbom-cyclonedx (90-day retention)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Alert on audit findings
        if: steps.npm_audit.outputs.exitcode != 0
        run: |
          echo "⚠️ npm audit found HIGH or CRITICAL vulnerabilities!" >> $GITHUB_STEP_SUMMARY
          echo "Run \`npm audit\` locally to see details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript check
        run: npx tsc -b --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run ESLint
        run: npx eslint . --max-warnings=0

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run Vitest
        run: npx vitest --run --reporter=verbose
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || '' }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || 'test-encryption-key-not-for-production' }}

  # Smoke tests against the live production deployment (kynthai.app).
  # API-first checks (public pages 200, protected routes 307->/login, health)
  # plus a few lightweight browser assertions. No build/db/secrets needed.
  # The old 3-browser matrix never ran anything real: it passed
  # --project=chromium|firefox|webkit (names that don't exist in
  # playwright.config.ts, real names are *-desktop) and started no server
  # (playwright webServer is disabled in CI), so every run failed in ~2s
  # and was hidden by continue-on-error. Replaced with this honest gate.
  e2e-smoke:
    name: E2E Smoke (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Playwright chromium
        run: npx playwright install chromium

      - name: Run prod smoke tests
        run: npx playwright test e2e/ci-smoke.spec.ts --project=chromium-desktop
        env:
          PLAYWRIGHT_BASE_URL: https://kynthai.app

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: e2e-report/
          retention-days: 30

name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  NEXT_PUBLIC_APP_URL: 'https://kynthai.app'

jobs:
  # ── Job 1: Lint + Type Check + Unit Tests ─────────────────────────────────
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Lockfile verification
        run: git diff --exit-code package-lock.json || echo '⚠️ Lockfile modified — ensure integrity'

      - name: npm audit (high/critical)
        run: npm audit --audit-level=high || echo '⚠️ npm audit found issues — review before merge'

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:ci

  # ── Job 2: Build ──────────────────────────────────────────────────────────
  build:
    name: Build App
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Create .env.local
        run: |
          cat > .env.local << 'EOF'
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          DIRECT_URL=${{ secrets.DIRECT_URL }}
          NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL=https://kynthai.app
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_JWT_SECRET=${{ secrets.SUPABASE_JWT_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          CRON_SECRET=${{ secrets.CRON_SECRET }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          NEXT_PUBLIC_STRIPE_PK=${{ secrets.NEXT_PUBLIC_STRIPE_PK }}
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER=${{ secrets.TWILIO_PHONE_NUMBER }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL=${{ secrets.SMTP_FROM_EMAIL }}
          NEXT_PUBLIC_APP_URL=https://kynthai.app
          NODE_ENV=production
          CORS_ORIGIN=https://kynthai.app,https://www.kynthai.app
          HIPAA_ENABLED=true
          NEXT_PUBLIC_COMPLIANCE_MODE=true
          NEXT_PUBLIC_JURISDICTION=US
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build app
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: |
            .next/
            public/
            package.json
            package-lock.json
            prisma/
          # .next is a hidden dir — without this the artifact only contained
          # public/ + prisma/, so the deploy job's cp .next-build/.next failed
          include-hidden-files: true
          retention-days: 1

  # ── Job 3: E2E Tests ──────────────────────────────────────────────────────
  # NOTE: Production is hosted on Vercel (kynthai.app) and deploys via Vercel's
  # Git integration / CLI, not this workflow. The old SSH "Deploy to Server"
  # job was removed — it had no secrets, no configured server, and never ran.
  # ─────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    env:
      # schema.prisma requires both DATABASE_URL and DIRECT_URL
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Start services
        run: |
          # Only the db is used by the e2e steps (they run npm/prisma/server on
          # the runner against localhost:5432). Building the full app image here
          # adds ~5 min and needs the whole prod env.
          docker compose -f docker-compose.yml up -d db
          sleep 8
          docker compose -f docker-compose.yml ps
          docker logs "$(docker compose -f docker-compose.yml ps -q db)" 2>&1 | tail -15 || true
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test

      - run: npm ci

      - run: npx prisma generate

      - name: Run DB push
        run: npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Start server
        run: npm start &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 30000 || true

      - name: Run E2E tests
        run: npm run test:e2e || true
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test

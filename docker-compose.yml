version: '3.8'

services:
  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports:
      - "3000:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      - NODE_ENV=production
      # DATABASE_URL should include ?sslmode=require for encrypted transport
      # Example: postgresql://kynthai:password@db:5432/kynthai_us?sslmode=require
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - CRON_SECRET=${CRON_SECRET}
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - NEXT_PUBLIC_WEBAPP_URL=${NEXT_PUBLIC_APP_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - SENTRY_DSN=${SENTRY_DSN}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_STRIPE_PK=${NEXT_PUBLIC_STRIPE_PK}
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN}
      - NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME}
      - NEXT_PUBLIC_UPLOAD_PRESET=${NEXT_PUBLIC_UPLOAD_PRESET}
      - ZENMUX_API_KEY=${ZENMUX_API_KEY}
      - VIDEO_TOKEN_SECRET=${VIDEO_TOKEN_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - NEXT_PUBLIC_COMPLIANCE_MODE=US
      - NEXT_PUBLIC_JURISDICTION=United States
      - NEXT_PUBLIC_PRIVACY_OFFICER_EMAIL=privacy@kynthai.app
      - NEXT_PUBLIC_SUPPORT_EMAIL=hello@kynthai.app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - uploads:/app/public/uploads
    networks:
      - frontend
      - backend

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kynthai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kynthai}
      POSTGRES_DB: ${POSTGRES_DB:-kynthai_us}
      # No POSTGRES_INITDB_ARGS override: --auth-local=scram-sha-256 breaks the
      # postgres image's first-boot password setup (it connects over the unix
      # socket before any password exists → init fails → db unreachable).
      # Image defaults (host=scram-sha-256, local=trust) are what prod uses.
    ports:
      # Publish for host-local tooling (prisma db push, e2e). Prod uses
      # docker-compose.prod.yml which does not expose the DB.
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kynthai} -d ${POSTGRES_DB:-kynthai_us}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - frontend

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
